<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CYBER GACHA — 分岐デモ</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#020a14;--bg2:#050f1e;--border:#0a2a4a;--border2:#0d3d6e;--text:#8eb8d8;--white:#c8e4f8;--dim:#3a6080;--cyan:#00e5ff;--green:#00ff88;--red:#ff3344;--gold:#ffd700;--purple:#cc88ff;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,180,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,180,255,.02) 1px,transparent 1px);background-size:32px 32px}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:2rem 1.25rem 4rem}
.hdr{text-align:center;margin-bottom:1.75rem;padding-bottom:1.25rem;border-bottom:.5px solid var(--border2)}
.hdr-eye{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--dim);margin-bottom:.35rem}
.hdr-title{font-family:'Orbitron',sans-serif;font-size:clamp(1.4rem,4vw,2.4rem);font-weight:900;color:var(--white);letter-spacing:.04em}
.hdr-title span{color:var(--cyan)}
.hdr-sub{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.1em;margin-top:.25rem}
.struct{display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;align-items:center;margin-bottom:1.75rem;padding:.9rem 1.1rem;border:.5px solid var(--border2);border-radius:4px;background:var(--bg2)}
.sb{text-align:center}
.sb-num{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:900;color:var(--cyan);margin-bottom:.15rem}
.sb-name{font-size:12px;font-weight:700;color:var(--white);margin-bottom:.15rem}
.sb-desc{font-size:11px;color:var(--dim);line-height:1.5}
.sa{font-size:1.6rem;color:var(--border2);text-align:center}
.rlabel{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.15em;color:var(--cyan);margin-bottom:.5rem}
.routes{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:5px;margin-bottom:1.25rem}
.rbtn{padding:9px 6px;border:.5px solid var(--border2);border-radius:3px;background:var(--bg2);cursor:pointer;text-align:center;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:2px}
.rbtn:hover{background:rgba(0,229,255,.04)}
.rbtn.on{border-color:currentColor;background:rgba(0,0,0,.3)}
.rb-grade{font-family:'Orbitron',monospace;font-size:13px;font-weight:700}
.rb-name{font-size:10px;color:var(--dim);white-space:pre-line;line-height:1.3}
.rb-pct{font-family:'Share Tech Mono',monospace;font-size:8px;opacity:.55}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
@media(max-width:540px){.demo-grid{grid-template-columns:1fr}}
.phone{background:#000;border:.5px solid var(--border2);border-radius:4px;overflow:hidden;aspect-ratio:9/16;max-height:480px;position:relative}
.phone canvas{position:absolute;inset:0;width:100%;height:100%}
.ipanel{display:flex;flex-direction:column;gap:.6rem}
.icard{border:.5px solid var(--border);border-radius:3px;background:var(--bg2);overflow:hidden}
.icard-head{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--dim);padding:6px 11px;border-bottom:.5px solid var(--border)}
.icard-body{padding:9px 11px}
.pr{display:flex;align-items:flex-start;gap:7px;margin-bottom:.35rem}
.pr:last-child{margin-bottom:0}
.pd{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:4px}
.pt{font-size:11px;color:var(--text);line-height:1.5}
.mr{display:flex;align-items:center;gap:7px;padding:6px 9px;border:.5px solid var(--border);border-radius:3px;background:rgba(0,0,0,.25);margin:.3rem 0}
.ml{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--dim);width:38px;letter-spacing:.04em;flex-shrink:0}
.mb{flex:1;height:7px;border-radius:2px;background:rgba(0,0,0,.4);overflow:hidden}
.mf{height:100%;border-radius:2px}
.mp{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;width:36px;text-align:right;flex-shrink:0}
.bn{font-size:11px;color:var(--text);line-height:1.6;padding:7px 9px;background:rgba(255,160,0,.05);border:.5px solid rgba(255,160,0,.2);border-radius:3px}
.bt{font-family:'Share Tech Mono',monospace;font-size:9px;color:#ff8833;display:block;margin-bottom:2px;letter-spacing:.04em}
.pbtn{width:100%;padding:10px;border:.5px solid var(--cyan);border-radius:3px;background:rgba(0,229,255,.06);color:var(--cyan);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.08em;transition:all .2s;text-align:center}
.pbtn:hover{background:rgba(0,229,255,.12);color:var(--white)}
</style>
</head>
<body>
<div class="wrap">
<div class="hdr">
  <div class="hdr-eye">CYBER GACHA — BRANCH DEMO / カードストック様</div>
  <div class="hdr-title">分岐設計 <span>DEMO</span></div>
  <div class="hdr-sub">S=虹 / A=金 / B=赤 / C,D=緑 / E=白</div>
</div>
<div class="struct">
  <div class="sb"><div class="sb-num">01</div><div class="sb-name">% 上昇フェーズ</div><div class="sb-desc">JUDGE %が上昇し<br>期待値を視覚化<br>内部で賞が決まる</div></div>
  <div class="sa">→</div>
  <div class="sb"><div class="sb-num">02</div><div class="sb-name">最終ジャッジ</div><div class="sb-desc">扉等のギミックで<br>賞ランクを確定<br>演出の山場</div></div>
</div>
<div class="rlabel">▶ ルートを選んでデモを再生</div>
<div class="routes" id="routes"></div>
<div class="demo-grid">
  <div class="phone"><canvas id="cv"></canvas></div>
  <div class="ipanel" id="ipanel"><div class="icard"><div class="icard-head">INFO</div><div class="icard-body" style="font-size:12px;color:var(--dim)">ルートを選択してください</div></div></div>
</div>
</div>
<script>
const ROUTES=[
  {id:'E',grade:'E',name:'白\n（等外）',col:'#666',pct:30,bg:'rgba(20,50,90,.45)',rt:'等外',rc:'#666',bc:null,betrayal:null,phases:[{c:'#3a6080',t:'% 上昇：20〜40%（最寒ゾーン）で推移'},{c:'#666',t:'最終ジャッジ：扉が開かない → 等外確定'}],desc:'最寒ゾーンで止まる。扉は開かず等外。'},
  {id:'CD',grade:'C/D',name:'緑\n（中当たり）',col:'#00ff88',pct:55,bg:'linear-gradient(90deg,#006633,#00ff88)',rt:'緑当選 C/D賞',rc:'#00ff88',bc:'#00ff88',betrayal:null,phases:[{c:'#00ff88',t:'% 上昇：50〜65%（緑域）で推移'},{c:'#00ff88',t:'最終ジャッジ：扉が開いて緑ランク文字が飛び出す'}],desc:'緑域で止まる素直なルート。'},
  {id:'B',grade:'B',name:'赤\n（A賞）',col:'#ff3344',pct:70,bg:'linear-gradient(90deg,#880011,#ff3344)',rt:'A賞 / 赤当選',rc:'#ff3344',bc:'#ff3344',betrayal:{text:'序盤60%（緑域偽装）→\n奇数聴牌判明 → 急上昇 → 70%赤域',start:60,end:70},phases:[{c:'#00ff88',t:'序盤：60%（緑域）偽装中'},{c:'#ff3344',t:'奇数聴牌判明 → 急上昇 → 70%赤域へ'},{c:'#ff3344',t:'最終ジャッジ：複数扉開 → 赤当選'}],desc:'緑偽装から赤昇格。奇数聴牌（1・3・5）連動。'},
  {id:'A',grade:'A',name:'金\n（S賞）',col:'#ffd700',pct:88,bg:'linear-gradient(90deg,#665500,#ffd700)',rt:'S賞 / 金当選',rc:'#ffd700',bc:'#ffd700',betrayal:null,phases:[{c:'#ffd700',t:'% 上昇：88%以上（激アツ域）で推移'},{c:'#ffd700',t:'最終ジャッジ：全扉開 → 金当選確定'}],desc:'最初から激アツ域。全扉開の豪華演出。'},
  {id:'S1',grade:'S',name:'虹プレミア\n（77%）',col:'#cc88ff',pct:77,bg:'linear-gradient(90deg,#7722ee,#cc88ff,#44ccff)',rt:'S賞 / 虹（プレミア）',rc:'#cc88ff',bc:'#cc88ff',betrayal:{text:'83%推移 → 数字が下落「えっ？」→\n77%ゾロ目着地 → 虹確定フラッシュ',start:83,end:77,is77:true},phases:[{c:'#ff9944',t:'% 上昇：83%（赤域）で推移'},{c:'#cc88ff',t:'メーター下落 → 77%ゾロ目着地 → 虹確定'},{c:'#cc88ff',t:'最終ジャッジ：プレミア演出 → 全扉開'}],desc:'80%→下落→77%ゾロ目で虹確定。「下がった＝吉」の逆説。'},
  {id:'S2',grade:'S',name:'虹\n（0%→100%）',col:'#cc88ff',pct:8,bg:'linear-gradient(90deg,#ff4444,#ffd700,#cc88ff,#00e5ff)',rt:'S賞 / 虹（最大逆転）',rc:'#cc88ff',bc:'#cc88ff',betrayal:{text:'10%以下（逆激アツ）→ JUDGE失敗\n→ 0%急落 → プチュン → 100%爆発',reversal:true},phases:[{c:'#ff6644',t:'% 上昇：8%（逆激アツゾーン）'},{c:'#ff3344',t:'JUDGE FAILED → 0%に急落'},{c:'#cc88ff',t:'プチュン → 0%→100%爆発 → 虹確定'}],desc:'10%以下は逆激アツ。0%落下後にプチュン最大逆転。'},
  {id:'S3',grade:'S',name:'虹\n（プチュン割込）',col:'#cc88ff',pct:35,bg:'linear-gradient(90deg,#ff4444,#ffd700,#cc88ff,#00e5ff)',rt:'S賞 / 虹（即時確定）',rc:'#cc88ff',bc:'#cc88ff',betrayal:{text:'演出進行中に突然プチュン発生\n→ 演出中断 → 暗転 → 虹確定',putchun:true},phases:[{c:'#888',t:'% 上昇：どのタイミングでも'},{c:'#cc88ff',t:'突然プチュン → 演出中断 → 暗転'},{c:'#cc88ff',t:'即100% → 全扉開 → 虹確定'}],desc:'予兆なし完全サプライズ。常に緊張感が持続する。'},
];

let raf=null;
const routesEl=document.getElementById('routes');
ROUTES.forEach((r,i)=>{
  const b=document.createElement('div');b.className='rbtn';b.style.color=r.col;
  b.innerHTML=`<span class="rb-grade">${r.grade}</span><span class="rb-name">${r.name}</span><span class="rb-pct">${r.pct}%</span>`;
  b.addEventListener('click',()=>{document.querySelectorAll('.rbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');play(r);});
  routesEl.appendChild(b);
});

function updatePanel(r){
  const p=document.getElementById('ipanel');p.innerHTML='';
  const c1=document.createElement('div');c1.className='icard';
  const mfBg=r.pct>=88?'linear-gradient(90deg,#880011,#ff3344)':r.pct===77?'linear-gradient(90deg,#7722ee,#cc88ff)':r.pct>=70?'linear-gradient(90deg,#aa4400,#ff9944)':r.pct>=50?'linear-gradient(90deg,#006633,#00ff88)':r.pct<=10?'linear-gradient(90deg,#cc2200,#ff6644)':'rgba(20,50,90,.6)';
  c1.innerHTML=`<div class="icard-head">${r.grade} — ${r.name.replace('\n',' ')}</div><div class="icard-body"><div style="font-size:11px;color:var(--dim);margin-bottom:.5rem;line-height:1.6">${r.desc}</div><div class="mr"><span class="ml">JUDGE</span><div class="mb"><div class="mf" style="width:${r.pct}%;background:${mfBg}"></div></div><span class="mp" style="color:${r.col}">${r.pct}%</span></div>${r.phases.map(ph=>`<div class="pr"><div class="pd" style="background:${ph.c}"></div><div class="pt">${ph.t}</div></div>`).join('')}</div>`;
  p.appendChild(c1);
  if(r.betrayal){
    const c2=document.createElement('div');c2.className='icard';
    c2.innerHTML=`<div class="icard-head">BETRAYAL</div><div class="icard-body"><div class="bn"><span class="bt">⚡ 裏切りの構造</span>${r.betrayal.text.split('\n').join('<br>')}</div></div>`;
    p.appendChild(c2);
  }
  const pb=document.createElement('button');pb.className='pbtn';pb.textContent='▶ もう一度';
  pb.addEventListener('click',()=>play(r));p.appendChild(pb);
}

const phone=document.querySelector('.phone'),cv=document.getElementById('cv');
function rsz(){cv.width=phone.clientWidth;cv.height=phone.clientHeight}rsz();
window.addEventListener('resize',()=>{rsz();if(!raf)idle();});

function idle(){
  const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  ctx.fillStyle='#020a14';ctx.fillRect(0,0,W,H);grid(ctx,W,H);
  ctx.fillStyle='rgba(0,180,255,.3)';ctx.font=`${Math.floor(W*.033)}px "Share Tech Mono"`;ctx.textAlign='center';
  ctx.fillText('ルートを選択して再生',W/2,H/2);
}
idle();

function grid(ctx,W,H){
  ctx.strokeStyle='rgba(0,100,180,.04)';ctx.lineWidth=.5;
  const g=Math.floor(W*.1);
  for(let x=0;x<W;x+=g){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=g){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
}

let S=null;
function play(r){
  updatePanel(r);
  if(raf){cancelAnimationFrame(raf);raf=null}
  const isRev=r.betrayal?.reversal,isPut=r.betrayal?.putchun,is77=r.betrayal?.is77;
  S={t:0,r,phase:'rise',pct:0,tgt:r.pct,is77,isRev,isPut,
     glitch:false,glitchT:0,risen83:false,judgeP:0,doorA:0};
  raf=requestAnimationFrame(loop);
}

function loop(){
  const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  tick();draw(ctx,W,H);
  if(S.phase!=='done') raf=requestAnimationFrame(loop); else raf=null;
}

function tick(){
  S.t++;const t=S.t;
  if(S.phase==='rise'){
    if(S.is77){
      if(!S.risen83){S.pct=Math.min(83,S.pct+.45);if(S.pct>=83)S.risen83=true;}
      else{S.pct=Math.max(77,S.pct-.18);if(S.pct<=77){S.pct=77;S.phase='judge';S.t=0;}}
    } else if(S.isRev){
      S.pct=Math.min(8,S.pct+.18);if(S.pct>=8&&t>50){S.phase='twist';S.t=0;}
    } else if(S.isPut){
      S.pct=Math.min(35,S.pct+.38);if(S.pct>=35&&t>30){S.phase='twist';S.t=0;}
    } else if(S.r.id==='B'){
      S.pct=Math.min(60,S.pct+.38);if(S.pct>=60&&t>60){S.phase='twist';S.t=0;}
    } else {
      S.pct=Math.min(S.tgt,S.pct+.55);if(S.pct>=S.tgt&&t>35){S.phase='judge';S.t=0;}
    }
  } else if(S.phase==='twist'){
    if(S.isRev){
      if(!S.glitch){S.pct=Math.max(0,S.pct-1.4);if(S.pct<=0){S.glitch=true;S.glitchT=0;}}
      else{S.glitchT++;if(S.glitchT>28){S.pct=Math.min(100,S.pct+4);if(S.pct>=100){S.phase='judge';S.t=0;}}}
    } else if(S.isPut){
      S.glitch=true;S.glitchT=(S.glitchT||0)+1;
      if(S.glitchT>20){S.pct=Math.min(100,S.pct+5);if(S.pct>=100){S.phase='judge';S.t=0;S.glitch=false;}}
    } else if(S.r.id==='B'){
      S.pct=Math.min(70,S.pct+.75);if(S.pct>=70&&S.t>25){S.phase='judge';S.t=0;}
    }
  } else if(S.phase==='judge'){
    S.judgeP=Math.min(1,S.t/55);if(S.t>80){S.phase='reveal';S.t=0;}
  } else if(S.phase==='reveal'){
    S.doorA=Math.min(1,S.t/65);if(S.t>130) S.phase='done';
  }
}

function draw(ctx,W,H){
  const gl=S.glitch&&(S.glitchT||0)<22;
  ctx.fillStyle=gl?'#000':'rgba(2,10,20,.22)';ctx.fillRect(0,0,W,H);
  if(!gl) grid(ctx,W,H);
  const sy=(S.t*1.1)%H;ctx.fillStyle='rgba(0,180,255,.022)';ctx.fillRect(0,sy,W,2);
  const cx=W/2,r=S.r;

  if(gl){
    for(let i=0;i<4;i++){const y=Math.random()*H;ctx.fillStyle=`rgba(0,229,255,${Math.random()*.3})`;ctx.fillRect(0,y,W*Math.random(),1+Math.random()*3);}
    ctx.fillStyle='rgba(0,229,255,.06)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#cc88ff';ctx.font=`900 ${Math.floor(W*.06)}px Orbitron`;ctx.textAlign='center';ctx.fillText('PUTCHUN',cx,H*.46);
    ctx.fillStyle='rgba(255,215,0,.75)';ctx.font=`${Math.floor(W*.026)}px "Share Tech Mono"`;ctx.fillText('⚡ OVERRIDE ⚡',cx,H*.54);
    return;
  }

  // フェーズラベル
  const pl={rise:'JUDGE % RISING...',twist:S.isRev?'FAILED...':'TWIST!',judge:'FINAL JUDGE',reveal:'OPENING...',done:'RESULT'};
  const pc={rise:'rgba(0,180,255,.6)',twist:'#ff6644',judge:r.col,reveal:r.col,done:r.col};
  ctx.fillStyle=pc[S.phase];ctx.font=`${Math.floor(W*.027)}px "Share Tech Mono"`;ctx.textAlign='center';
  ctx.fillText(pl[S.phase]||'',cx,H*.09);

  // %メーター
  const bx=W*.1,bw=W*.8,by=H*.2,bh=Math.floor(W*.042);
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.strokeStyle='rgba(0,100,180,.22)';ctx.lineWidth=.5;
  ctx.beginPath();ctx.rect(bx,by,bw,bh);ctx.fill();ctx.stroke();
  const pv=Math.min(100,Math.max(0,S.pct));
  if(pv>0){
    let bg;
    if(pv>=100){const g=ctx.createLinearGradient(bx,0,bx+bw,0);g.addColorStop(0,'#ff4444');g.addColorStop(.33,'#ffd700');g.addColorStop(.66,'#cc88ff');g.addColorStop(1,'#00e5ff');bg=g;}
    else if(pv===77){const g=ctx.createLinearGradient(bx,0,bx+bw,0);g.addColorStop(0,'#7722ee');g.addColorStop(.5,'#cc88ff');g.addColorStop(1,'#44ccff');bg=g;}
    else if(pv>=88){const g=ctx.createLinearGradient(bx,0,bx+bw,0);g.addColorStop(0,'#880011');g.addColorStop(1,'#ff3344');bg=g;}
    else if(pv>=70){const g=ctx.createLinearGradient(bx,0,bx+bw,0);g.addColorStop(0,'#aa4400');g.addColorStop(1,'#ff9944');bg=g;}
    else if(pv>=50){const g=ctx.createLinearGradient(bx,0,bx+bw,0);g.addColorStop(0,'#006633');g.addColorStop(1,'#00ff88');bg=g;}
    else if(pv<=10){const g=ctx.createLinearGradient(bx,0,bx+bw,0);g.addColorStop(0,'#cc2200');g.addColorStop(1,'#ff6644');bg=g;}
    else bg='rgba(20,50,90,.7)';
    ctx.fillStyle=bg;ctx.fillRect(bx,by,bw*(pv/100),bh);
  }
  // 77マーカー
  const m77=bx+bw*.77;
  ctx.strokeStyle='rgba(204,136,255,.5)';ctx.lineWidth=.7;ctx.setLineDash([2,2]);
  ctx.beginPath();ctx.moveTo(m77,by-3);ctx.lineTo(m77,by+bh+3);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(204,136,255,.6)';ctx.font=`${Math.floor(W*.018)}px "Share Tech Mono"`;ctx.textAlign='center';ctx.fillText('77🌈',m77,by-5);

  // %数値
  const pdisp=Math.round(pv);
  const pcol=pv<=10?'#ff6644':pv===77?'#cc88ff':pv>=88?'#ff3344':pv>=70?'#ff9944':pv>=50?'#00ff88':'rgba(0,180,255,.55)';
  ctx.fillStyle=pcol;ctx.font=`900 ${Math.floor(W*.054)}px Orbitron`;ctx.textAlign='center';
  ctx.fillText(`${pdisp}%${pv===77?' 🌈':''}`,cx,by-Math.floor(W*.018));
  const hl=pv<=10?'逆激アツ！':pv===77?'虹確定！':pv>=88?'激アツ！':pv>=70?'熱 い！':pv>=50?'緑域':'最寒ゾーン';
  ctx.fillStyle=pcol;ctx.font=`${Math.floor(W*.022)}px "Share Tech Mono"`;
  ctx.fillText(hl,cx,by+bh+Math.floor(W*.028));

  // 扉
  const dY=H*.52,dH=H*.26,dW=W*.17;
  const nD=r.id==='E'?1:r.id==='CD'?1:r.id==='B'?2:3;
  const sp=dW+Math.floor(W*.04);
  const dSX=cx-(nD*sp)/2+sp/2;
  for(let d=0;d<nD;d++){
    const dx=dSX+d*sp;
    const isOpen=S.phase==='reveal'||S.phase==='done';
    const oa=isOpen?Math.min(1,S.doorA*(1+d*.18)):0;
    const skip=r.id==='E';
    ctx.strokeStyle=skip?'#2a2a2a':r.col;ctx.lineWidth=1;
    const rgb=r.id==='CD'?'0,80,40':r.id==='B'?'80,10,10':r.id==='A'?'80,60,0':'60,0,110';
    ctx.fillStyle=skip?'rgba(20,20,20,.4)':`rgba(${rgb},.18)`;
    ctx.beginPath();ctx.rect(dx-dW/2,dY-dH/2,dW,dH);ctx.fill();ctx.stroke();
    if(!skip){
      const ow=dW*(1-oa);
      if(ow>0){
        ctx.fillStyle=`rgba(${rgb},.82)`;
        ctx.beginPath();ctx.rect(dx-dW/2,dY-dH/2,ow/2,dH);ctx.fill();
        ctx.beginPath();ctx.rect(dx+dW/2-ow/2,dY-dH/2,ow/2,dH);ctx.fill();
      }
      if(oa>.5&&d===Math.floor(nD/2)){
        const a=Math.min(1,(oa-.5)*2.2);
        ctx.fillStyle=r.rc;ctx.globalAlpha=a;
        ctx.font=`900 ${Math.floor(dW*.45)}px Orbitron`;ctx.textAlign='center';
        ctx.fillText(r.grade,dx,dY+Math.floor(dW*.15));ctx.globalAlpha=1;
      }
    } else {
      ctx.fillStyle='rgba(60,60,80,.25)';ctx.beginPath();ctx.rect(dx-dW/2,dY-dH/2,dW,dH);ctx.fill();
      ctx.fillStyle='#333';ctx.font=`${Math.floor(dW*.5)}px monospace`;ctx.textAlign='center';ctx.fillText('✕',dx,dY+Math.floor(dW*.18));
    }
  }

  // ジャッジ演出
  if(S.phase==='judge'){
    const p=S.judgeP;
    [.3,.55,.8,1].forEach((rp,ri)=>{
      const rp2=Math.max(0,p-ri*.12);if(!rp2)return;
      ctx.beginPath();ctx.arc(cx,H*.5,rp2*Math.min(W,H)*.32,0,Math.PI*2);
      ctx.strokeStyle=`rgba(${r.id==='E'?'80,80,120':r.id.startsWith('S')?'160,80,255':'0,160,255'},${(1-rp2)*.28})`;
      ctx.lineWidth=1.5;ctx.stroke();
    });
    if(p>.45){
      ctx.fillStyle=`${r.rc}${Math.round((p-.45)*1.8*255).toString(16).padStart(2,'0')}`;
      ctx.font=`900 ${Math.floor(W*.034)}px Orbitron`;ctx.textAlign='center';
      ctx.fillText(r.id==='E'?'ACCESS DENIED':'FINAL JUDGE',cx,H*.86);
    }
  }

  // 結果テキスト
  if(S.phase==='reveal'&&S.doorA>.55){
    const a=Math.min(1,(S.doorA-.55)*2.5);
    ctx.fillStyle=r.rc;ctx.globalAlpha=a;
    ctx.font=`900 ${Math.floor(W*.038)}px Orbitron`;ctx.textAlign='center';
    ctx.fillText(r.rt,cx,H*.87);ctx.globalAlpha=1;
  }
  if(r.id==='E'&&(S.phase==='reveal'||S.phase==='done')){
    const a=Math.min(1,S.doorA*2.2);
    ctx.fillStyle=`rgba(100,110,130,${a})`;ctx.font=`900 ${Math.floor(W*.038)}px Orbitron`;ctx.textAlign='center';ctx.fillText('等外',cx,H*.87);
  }
}
</script>
