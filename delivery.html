<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>からくりオリパ 配送管理</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f1f2f6; --surface:#ffffff; --surface-2:#f6f7fa; --ink:#171a22; --ink-2:#4f5566; --muted:#8a8f9e; --line:#e2e4ec; --line-2:#eef0f5;
  --accent:#c9472a; --accent-ink:#fff;
  --wait:#b8770c; --wait-bg:#fff4dc; --late:#c62828; --late-bg:#fde8e8; --done:#1a7f37; --done-bg:#e3f5e8; --err:#7a3ea1; --err-bg:#f1e6fa; --new:#2a78d6; --new-bg:#e3eefb;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 4px 16px rgba(20,24,40,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#14161c; --surface:#1d2027; --surface-2:#23262f; --ink:#eef0f5; --ink-2:#c0c4d0; --muted:#8d92a0; --line:#2e323c; --line-2:#272a33;
    --accent:#ee7a5c; --accent-ink:#1a0d09;
    --wait:#e0a52c; --wait-bg:#3a2e12; --late:#f26d6d; --late-bg:#3f1f1f; --done:#4cc26b; --done-bg:#183424; --err:#c89ae8; --err-bg:#2f2140; --new:#5b9cf0; --new-bg:#1c2c44;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14161c; --surface:#1d2027; --surface-2:#23262f; --ink:#eef0f5; --ink-2:#c0c4d0; --muted:#8d92a0; --line:#2e323c; --line-2:#272a33;
  --accent:#ee7a5c; --accent-ink:#1a0d09;
  --wait:#e0a52c; --wait-bg:#3a2e12; --late:#f26d6d; --late-bg:#3f1f1f; --done:#4cc26b; --done-bg:#183424; --err:#c89ae8; --err-bg:#2f2140; --new:#5b9cf0; --new-bg:#1c2c44;
  --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Zen Kaku Gothic New","IBM Plex Sans JP",sans-serif;margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:900}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.wrap{max-width:1180px;margin:0 auto;padding:20px 24px 80px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:18px}
.snap{font-size:12px;color:var(--muted);text-align:right}.snap b{color:var(--ink-2);font-weight:600}
/* summary */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0 14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;font:inherit;color:inherit;border-left:4px solid var(--c,var(--line))}
.tile[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-1px}
.tile .l{font-size:12px;color:var(--muted);font-weight:500}
.tile .v{font-family:"Zen Kaku Gothic New",sans-serif;font-size:26px;font-weight:700;line-height:1.2;margin-top:2px}
.tile .v small{font-size:12px;font-weight:500;color:var(--ink-2);margin-left:3px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
input[type=search],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:220px}
button.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.count{font-size:12px;color:var(--muted);margin-left:auto}
/* list */
.list{display:grid;gap:10px}
.dv{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:grid;grid-template-columns:130px 1.1fr 1.6fr;gap:0}
.dv>div{padding:12px 14px;min-width:0}
.dv .idcol{border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px}
.dv .idcol .id{font-family:"Zen Kaku Gothic New",sans-serif;font-size:22px;font-weight:900;letter-spacing:-.01em}
.dv .idcol .id small{font-size:12px;color:var(--muted);font-weight:500;margin-right:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:var(--c);background:var(--cb);width:max-content}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.pill.waiting{--c:var(--wait);--cb:var(--wait-bg)} .pill.late{--c:var(--late);--cb:var(--late-bg)} .pill.delivered{--c:var(--done);--cb:var(--done-bg)} .pill.error{--c:var(--err);--cb:var(--err-bg)} .pill.new{--c:var(--new);--cb:var(--new-bg)}
.age{font-size:12px;color:var(--ink-2)}.age b{font-weight:700;color:var(--ink)}
.age.late b{color:var(--late)}
.dv.late{border-left:4px solid var(--late)} .dv.new{border-left:4px solid var(--new)} .dv.error{border-left:4px solid var(--err)} .dv.delivered{opacity:.85}
.addr{font-size:13px}
.addr .nm{font-size:16px;font-weight:700;font-family:"Zen Kaku Gothic New",sans-serif}
.addr .kana{font-size:11px;color:var(--muted);margin-left:6px;font-weight:500}
.addr .pc{color:var(--ink-2)}
.addr .tel{color:var(--ink-2);font-size:12px;margin-top:4px}
.addr .same{margin-top:6px;font-size:11px;color:var(--new);font-weight:600}
.copy{font-size:11px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:6px;padding:1px 7px;cursor:pointer;font-family:inherit;margin-left:6px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.it{display:grid;grid-template-columns:60px 1fr;gap:8px;align-items:start;background:var(--surface-2);border-radius:8px;padding:6px}
.th{width:60px;height:84px;border-radius:6px;background:var(--line-2);display:grid;place-items:center;overflow:hidden;position:relative}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .ph{font-size:10px;color:var(--muted);text-align:center;padding:4px;line-height:1.3;word-break:break-all}
.it .cn{font-size:12px;font-weight:600;line-height:1.35;word-break:break-all}
.it .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;font-size:11px;color:var(--ink-2)}
.chip{border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--surface)}
.chip.PSA{border-color:var(--wait);color:var(--wait);font-weight:700}
.chip.Unopened{border-color:var(--new);color:var(--new)}
.it .box{font-size:11px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itemsum{font-size:12px;color:var(--ink-2);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.work{grid-column:1/-1;border-top:1px solid var(--line-2);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px !important;background:var(--surface-2);border-radius:0 0 12px 12px}
.work label{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.work input[type=text]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:180px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.work input.memo{width:220px;font-family:inherit}
.work input[type=checkbox]{width:16px;height:16px;accent-color:var(--done)}
.work .saved{font-size:11px;color:var(--done);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,12,20,.55);display:none;place-items:center;z-index:30;padding:20px}
.modal[open]{display:grid}
.modal .box{background:var(--surface);border-radius:12px;padding:18px;max-width:720px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal textarea{width:100%;height:240px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;margin:10px 0}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
@media (max-width:860px){.dv{grid-template-columns:1fr}.dv .idcol{border-right:0;border-bottom:1px solid var(--line-2);flex-direction:row;align-items:center;flex-wrap:wrap}}
</style>
</head>

<script>
const $=s=>document.querySelector(s);const fmt=n=>Math.round(n).toLocaleString('ja-JP');
const KEY='karakuri-delivery-edits';let edits={};try{edits=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){edits={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(edits))}catch(e){}}
function daysBetween(a,b){return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000);}
const rows=DELIVERIES.map(d=>{const day=d.created.slice(0,10);const age=daysBetween(day,TODAY);const e=edits[d.id]||{};
  let cat=d.status;if(d.status==='waiting'&&age>7)cat='late';const isNew=day===TODAY&&d.status!=='delivered';
  return {...d,day,age,cat,isNew,pts:d.items.reduce((s,i)=>s+(i.pts||0),0),hay:(d.id+' '+d.name+' '+d.kana+' '+d.postal+' '+d.items.map(i=>i.card).join(' ')).toLowerCase()};});
// bundle candidates: same name+postal among not-delivered
const grp={};rows.filter(r=>r.status!=='delivered').forEach(r=>{const k=r.name+'|'+r.postal;(grp[k]=grp[k]||[]).push(r.id);});
rows.forEach(r=>{if(Array.isArray(r.bundle))return;const g=grp[r.name+'|'+r.postal]||[];r.bundle=g.filter(x=>x!==r.id);});
const cats=[
  {k:'new',l:'本日追加',c:'var(--new)',f:r=>r.isNew},
  {k:'late',l:'遅延（7日超）',c:'var(--late)',f:r=>r.cat==='late'},
  {k:'waiting',l:'発送待ち（全て）',c:'var(--wait)',f:r=>r.status==='waiting'},
  {k:'error',l:'エラー',c:'var(--err)',f:r=>r.status==='error'},
  {k:'delivered',l:'完了（直近14日）',c:'var(--done)',f:r=>r.status==='delivered'},
  {k:'all',l:'すべて表示',c:'var(--line)',f:r=>true},
];
let cur='waiting';
function renderSum(){$('#sum').innerHTML=cats.map(c=>{const n=rows.filter(c.f).length;const pts=rows.filter(c.f).reduce((s,r)=>s+r.pts,0);return `<button class="tile" style="--c:${c.c}" data-k="${c.k}" aria-pressed="${cur===c.k}"><div class="l">${c.l}</div><div class="v">${n}<small>件</small></div><div class="l">${rows.filter(c.f).reduce((s,r)=>s+r.items.length,0)}点 · ${fmt(pts)}C</div></button>`;}).join('');
  document.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>{cur=t.dataset.k;renderSum();renderList();}));}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pill(r){if(r.isNew&&r.status==='waiting'&&r.cat!=='late')return `<span class="pill new">本日追加</span>`;const m={waiting:'発送待ち',late:`遅延 ${r.age}日`,delivered:'完了',error:'エラー'};return `<span class="pill ${r.cat}">${m[r.cat]}</span>`;}
function itemHtml(i){const ph=`<div class="ph">${esc(i.card).slice(0,24)}</div>`;const img=i.img?`<img src="${esc(i.img)}" alt="" loading="lazy" data-name="${esc(String(i.card||'').slice(0,24))}">`:ph;
  return `<div class="it"><div class="th">${img}</div><div><div class="cn">${esc(i.card)}</div><div class="meta"><span class="chip ${i.cond}">${i.cond}</span><span>${fmt(i.pts||0)}C</span><span class="hint">gift ${i.gift_id}</span></div>${i.box?`<div class="box" title="${esc(i.box)}">${i.box_id?'#'+i.box_id+' ':''}${esc(i.box)}</div>`:''}</div></div>`;}
function renderList(){const q=$('#q').value.trim().toLowerCase();const c=cats.find(x=>x.k===cur);let list=rows.filter(c.f).filter(r=>!q||r.hay.includes(q));const s=$('#sort').value;
  list.sort((a,b)=>s==='old'?a.created.localeCompare(b.created):s==='new'?b.created.localeCompare(a.created):a.id-b.id);
  $('#count').textContent=`${list.length}件 / 景品${list.reduce((s,r)=>s+r.items.length,0)}点`;
  if(!list.length){$('#list').innerHTML='<div class="empty">該当する配送はありません</div>';return;}
  $('#list').innerHTML=list.map(r=>{const e=edits[r.id]||{};const cls=[r.cat,r.isNew?'new':''].join(' ');
    return `<article class="dv ${cls}" data-id="${r.id}">
      <div class="idcol"><div class="id"><small>配送ID</small>${r.id}</div>${pill(r)}<div class="age ${r.cat==='late'?'late':''}">依頼 ${r.created.slice(5,16)}<br>${r.status==='delivered'?`完了 ${r.updated.slice(5,16)}`:`<b>${r.age}日</b> 経過`}</div></div>
      <div class="addr"><div><span class="nm">${esc(r.name)}</span><span class="kana">${esc(r.kana)}</span> 様</div><div class="pc">〒${esc(r.postal).replace(/^(\d{3})(\d{4})$/,'$1-$2')}</div><div>${esc(r.addr1)}</div><div>${esc(r.addr2)}</div><div class="tel">${esc(r.tel)} <button class="copy" data-copy="${esc(r.postal+' '+r.addr1+' '+r.addr2+' '+r.name)}">住所をコピー</button></div>${r.bundle.length?`<div class="same">同一宛先の未発送: ${r.bundle.map(x=>'#'+x).join(', ')}（同梱可）</div>`:''}</div>
      <div><div class="itemsum"><span>景品 ${r.items.length}点</span><span>${fmt(r.pts)}C</span></div><div class="items">${r.items.map(itemHtml).join('')||'<span class="hint">景品データなし</span>'}</div></div>
      <div class="work"><label>追跡番号 <input type="text" data-f="tracking" value="${esc(e.tracking??r.tracking)}" placeholder="0000-0000-0000" inputmode="numeric"></label><label>メモ <input type="text" class="memo" data-f="memo" value="${esc(e.memo??r.memo)}" placeholder="同梱・不在など"></label><label><input type="checkbox" data-f="done" ${e.done?'checked':''}> 発送完了</label>${(e.tracking||e.done||e.memo)?'<span class="saved">✓ 保存済み</span>':''}</div>
    </article>`;}).join('');
  document.querySelectorAll('.work input').forEach(inp=>inp.addEventListener('change',()=>{const id=inp.closest('.dv').dataset.id;edits[id]=edits[id]||{};const f=inp.dataset.f;edits[id][f]=f==='done'?inp.checked:inp.value.trim();save();const w=inp.closest('.work');if(!w.querySelector('.saved'))w.insertAdjacentHTML('beforeend','<span class="saved">✓ 保存済み</span>');}));
  document.querySelectorAll('.th img').forEach(im=>im.addEventListener('error',()=>{const d=document.createElement('div');d.className='ph';d.textContent=im.dataset.name;im.replaceWith(d);}));
  document.querySelectorAll('.copy').forEach(b=>b.addEventListener('click',()=>{navigator.clipboard&&navigator.clipboard.writeText(b.dataset.copy).then(()=>{b.textContent='コピーしました';setTimeout(()=>b.textContent='住所をコピー',1200);});}));}
$('#q').addEventListener('input',renderList);$('#sort').addEventListener('change',renderList);
$('#exportBtn').addEventListener('click',()=>{const lines=['delivery_id,tracking_number,status,memo'];Object.entries(edits).forEach(([id,e])=>{if(e.tracking||e.done||e.memo)lines.push(`${id},${e.tracking||''},${e.done?'delivered':''},"${(e.memo||'').replace(/"/g,'""')}"`);});$('#csv').value=lines.join('\n');$('#modal').setAttribute('open','');});
$('#closeModal').addEventListener('click',()=>$('#modal').removeAttribute('open'));
$('#copyCsv').addEventListener('click',()=>{const t=$('#csv');t.select();navigator.clipboard&&navigator.clipboard.writeText(t.value);$('#copyCsv').textContent='コピーしました';setTimeout(()=>$('#copyCsv').textContent='コピー',1200);});
renderSum();renderList();
</script>
