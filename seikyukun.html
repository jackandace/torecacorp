<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>請求くん</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP', sans-serif; background: #f0f0f0; color: #222; font-size: 14px; }
header { background: #fff; border-bottom: 2px solid #333; padding: 12px 24px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; }
header span { font-size: 12px; color: #888; font-weight: 400; }
.header-actions { margin-left: auto; display: flex; gap: 8px; }
.btn { padding: 8px 20px; font-size: 13px; font-family: 'Noto Sans JP', sans-serif; border: 1.5px solid #333; border-radius: 3px; cursor: pointer; font-weight: 500; transition: 0.15s; }
.btn-primary { background: #333; color: #fff; } .btn-primary:hover { background: #000; }
.btn-ghost { background: #fff; color: #333; } .btn-ghost:hover { background: #f5f5f5; }
.container { max-width: 900px; margin: 28px auto; padding: 0 20px 60px; display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
.col-left { display: flex; flex-direction: column; gap: 16px; }
.col-right { display: flex; flex-direction: column; gap: 16px; }
.card { background: #fff; border: 1px solid #ccc; border-radius: 3px; padding: 20px; }
.card-label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #666; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid #ddd; }
.doc-type-group { display: flex; }
.doc-type-btn { flex: 1; padding: 10px; font-size: 14px; font-weight: 700; font-family: 'Noto Sans JP', sans-serif; border: 1.5px solid #ccc; background: #fff; cursor: pointer; transition: 0.15s; letter-spacing: 0.05em; }
.doc-type-btn:first-child { border-radius: 3px 0 0 3px; }
.doc-type-btn:last-child { border-radius: 0 3px 3px 0; margin-left: -1.5px; }
.doc-type-btn.active { background: #333; color: #fff; border-color: #333; }
.form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.form-row:last-child { margin-bottom: 0; }
.form-row label { font-size: 11px; font-weight: 700; color: #555; letter-spacing: 0.06em; }
.form-row input, .form-row textarea { font-family: 'Noto Sans JP', sans-serif; font-size: 13px; border: 1px solid #ccc; border-radius: 2px; padding: 7px 10px; color: #222; transition: 0.15s; width: 100%; }
.form-row input:focus, .form-row textarea:focus { outline: none; border-color: #333; }
.form-row textarea { resize: vertical; min-height: 60px; }
.form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.items-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
.items-table th { font-size: 11px; font-weight: 700; color: #555; letter-spacing: 0.06em; border-bottom: 2px solid #333; padding: 6px 8px; text-align: left; background: #f8f8f8; }
.items-table th.r, .items-table td.r { text-align: right; }
.items-table td { padding: 5px 4px; border-bottom: 1px solid #e8e8e8; vertical-align: middle; }
.items-table td input, .items-table td select { font-family: 'Noto Sans JP', sans-serif; font-size: 12px; border: 1px solid #ddd; border-radius: 2px; padding: 4px 6px; width: 100%; color: #222; }
.items-table td input:focus, .items-table td select:focus { outline: none; border-color: #333; }
.td-name{width:38%;} .td-qty{width:9%;} .td-unit{width:10%;} .td-price{width:16%;} .td-sub{width:16%;font-size:12px;padding-right:8px;} .td-del{width:5%;text-align:center;}
.btn-del { background: none; border: none; cursor: pointer; color: #bbb; font-size: 16px; padding: 2px 4px; border-radius: 2px; }
.btn-del:hover { color: #c00; background: #fff0f0; }
.btn-add-row { background: none; border: 1px dashed #bbb; border-radius: 2px; color: #666; font-size: 12px; font-family: 'Noto Sans JP', sans-serif; cursor: pointer; padding: 7px 14px; width: 100%; transition: 0.15s; }
.btn-add-row:hover { border-color: #333; color: #333; background: #fafafa; }
.tax-group { display: flex; gap: 16px; margin-bottom: 12px; }
.tax-group label { font-size: 12px; color: #444; display: flex; align-items: center; gap: 4px; cursor: pointer; }
.summary-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.summary-table td { padding: 6px 8px; }
.summary-table td.lbl { color: #555; }
.summary-table td:last-child { text-align: right; font-weight: 500; }
.summary-table tr.total td { font-size: 16px; font-weight: 700; border-top: 2px solid #333; padding-top: 10px; }
.sender-info { font-size: 12px; line-height: 1.9; color: #444; text-align: left; }
.sender-info strong { color: #222; font-size: 13px; }
.sender-divider { border: none; border-top: 1px solid #e0e0e0; margin: 12px 0; }
#preview-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200; overflow-y: auto; padding: 24px 16px; }
#preview-wrap { max-width: 680px; margin: auto; background: #fff; border-radius: 3px; box-shadow: 0 8px 40px rgba(0,0,0,0.3); overflow: hidden; }
.modal-header { background: #333; color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; }
.modal-header button { background: none; border: none; color: #fff; cursor: pointer; font-size: 18px; }
.modal-body { padding: 40px 44px; }
.modal-footer { padding: 14px 20px; border-top: 1px solid #ddd; display: flex; justify-content: flex-end; gap: 10px; }
.pv-title{text-align:center;font-size:20px;font-weight:700;letter-spacing:0.4em;margin-bottom:22px;padding-bottom:10px;border-bottom:2px solid #333;}
.pv-meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;overflow:hidden;}
.pv-to-name{font-size:15px;font-weight:700;} .pv-to-sub{font-size:10px;color:#666;margin-top:3px;} .pv-subject{font-size:11px;margin-top:8px;}
.pv-from{font-size:10px;color:#444;line-height:1.8;text-align:left;position:relative;padding-left:25%;}
.pv-from strong{font-size:12px;color:#222;}
.pv-nos{font-size:10px;color:#444;margin-bottom:14px;}
.pv-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:16px;}
.pv-table th{border-top:2px solid #333;border-bottom:1px solid #333;padding:6px 8px;font-size:10px;font-weight:700;color:#333;background:#f5f5f5;}
.pv-table th.r,.pv-table td.r{text-align:right;}
.pv-table td{padding:7px 8px;border-bottom:1px solid #e8e8e8;}
.pv-subs{display:flex;justify-content:flex-end;margin-bottom:16px;}
.pv-subs table{font-size:11px;min-width:200px;border-collapse:collapse;}
.pv-subs td{padding:4px 8px;} .pv-subs td:last-child{text-align:right;font-weight:500;}
.pv-subs tr.total td{font-size:13px;font-weight:700;border-top:2px solid #333;padding-top:6px;}
.pv-bank{font-size:12px;color:#333;line-height:2.0;margin-bottom:12px;} .pv-bank strong{color:#222;}
.pv-biko{border:1px solid #ccc;border-radius:2px;padding:8px 12px;font-size:11px;line-height:1.9;}
.pv-biko-lbl{font-weight:700;margin-bottom:3px;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(12px);background:#333;color:#fff;padding:10px 22px;border-radius:3px;font-size:13px;opacity:0;transition:0.25s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <h1>請求くん <span>— 見積・請求書ジェネレーター</span></h1>
  <div class="header-actions">
    <button class="btn btn-ghost" onclick="resetForm()">リセット</button>
    <button class="btn btn-ghost" onclick="previewDoc()">プレビュー</button>
    <button class="btn btn-primary" onclick="downloadPdf()">PDF 出力</button>
  </div>
</header>
<div class="container">
  <div class="col-left">
    <div class="card">
      <div class="doc-type-group">
        <button class="doc-type-btn" id="btn-estimate" onclick="setDocType('estimate')">見積書</button>
        <button class="doc-type-btn active" id="btn-invoice" onclick="setDocType('invoice')">請求書</button>
      </div>
    </div>
    <div class="card">
      <div class="card-label">基本情報</div>
      <div class="form-row"><label>宛先</label><input type="text" id="client-name" placeholder="例: A-LINK合同会社　御中"></div>
      <div class="form-row"><label>件名</label><input type="text" id="subject" placeholder="例: ポケモンカード卸"></div>
      <div class="form-2col">
        <div class="form-row" style="margin-bottom:0"><label id="date-label">請求日</label><input type="date" id="issue-date"></div>
        <div class="form-row" style="margin-bottom:0"><label id="limit-label">支払期限</label><input type="date" id="due-date"></div>
      </div>
      <div class="form-row" style="margin-top:12px;margin-bottom:0"><label id="num-label">請求No.</label><input type="text" id="doc-number" placeholder="例: 20260310"></div>
    </div>
    <div class="card">
      <div class="card-label">明細</div>
      <table class="items-table">
        <thead><tr>
          <th class="td-name">摘要</th><th class="td-qty r">数量</th><th class="td-unit">単位</th>
          <th class="td-price r">単価</th><th class="td-sub r">金額</th><th class="td-del"></th>
        </tr></thead>
        <tbody id="items-body"></tbody>
      </table>
      <button class="btn-add-row" onclick="addRow()">＋ 行を追加</button>
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid #eee;">
        <div class="tax-group">
          <label><input type="radio" name="tax" value="0.10" checked onchange="recalc()"> 10%（標準）</label>
          <label><input type="radio" name="tax" value="0.08" onchange="recalc()"> 8%（軽減）</label>
          <label><input type="radio" name="tax" value="0" onchange="recalc()"> 非課税</label>
        </div>
        <table class="summary-table">
          <tr><td class="lbl">小計</td><td id="subtotal-display">¥0</td></tr>
          <tr><td class="lbl" id="tax-label-disp">消費税（10%）</td><td id="tax-display">¥0</td></tr>
          <tr class="total"><td class="lbl">合計（税込）</td><td id="total-display">¥0</td></tr>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="card-label">備考（追記）</div>
      <div class="form-row" style="margin-bottom:0"><textarea id="notes" placeholder="振込手数料の文言は自動で入ります。追加事項があればこちらに..."></textarea></div>
    </div>
  </div>
  <div class="col-right">
    <div class="card">
      <div class="card-label">請求元（固定）</div>
      <div style="position:relative;">
        <div class="sender-info" style="">
          <strong>株式会社パレットグループ</strong><br>
          東京都千代田区神田鍛冶町3丁目3番地1<br>
          神田ノースフロント 8F<br>
          TEL：03-4405-4584<br>
          E-Mail：<span id="s-email"></span><br>
          インボイス登録番号：T8011001119787
        </div>
        <img id="stamp-sidebar" style="position:absolute;top:0;right:0;width:72px;height:72px;">
      </div>
      <hr class="sender-divider">
      <div class="sender-info">
        <strong style="font-size:11px;color:#666;font-weight:700;letter-spacing:0.06em;">振込先</strong><br>
        GMOあおぞらネット銀行(0310)<br>法人第二営業部支店(102)<br>
        普通：1673852　カ）アリイ<br>
        <span style="font-size:11px;color:#999;">※社名変更前の口座名義となります。</span>
      </div>
    </div>
    <div class="card">
      <div class="card-label">出力</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button class="btn btn-ghost" style="width:100%" onclick="previewDoc()">プレビュー確認</button>
        <button class="btn btn-primary" style="width:100%;padding:12px;font-size:14px;" onclick="downloadPdf()">PDF 出力</button>
      </div>
      <p style="font-size:10px;color:#999;margin-top:10px;line-height:1.6;">印刷ダイアログが開きます。<br>「PDFに保存」を選ぶとPDF保存できます。</p>
    </div>
  </div>
</div>
<div id="preview-modal">
  <div id="preview-wrap">
    <div class="modal-header">
      <span id="modal-title">プレビュー</span>
      <button onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="preview-content"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">閉じる</button>
      <button class="btn btn-primary" onclick="downloadPdf()">PDF 出力</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script src="seikyukun.js"></script>
</body>
</html>
