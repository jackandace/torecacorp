<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>トレカ商事カンパニー｜2026年度 2Q業績報告</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
/* =========================================================
   トレカ商事カンパニー 総会資料  Design Master v1.0 準拠
   配色・余白・タイポグラフィはすべてここ(CSS変数)で一括管理
   ========================================================= */
:root{
  --primary:#0F2D6B;     /* ネイビー */
  --secondary:#1F5FFF;   /* アクセントブルー */
  --bg:#FFFFFF;
  --gray:#F5F6F8;        /* ライトグレー */
  --line:#E3E6EC;
  --ink:#1A2233;         /* 本文 */
  --ink-sub:#566070;     /* 補足テキスト（投影で読めるよう少し濃く） */
  --success:#00A76F;
  --warning:#FFB020;
  --danger:#FF5630;

  --slide-w:1280px;
  --slide-h:720px;
  --pad:64px;            /* スライド余白(大きめ) */

  --font:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#5b6172;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;}

/* ---- 画面表示時のビューア(中央寄せ・スクロール) ---- */
.deck{display:flex;flex-direction:column;align-items:center;gap:28px;padding:40px 0 80px;}

.slide{
  position:relative;
  width:var(--slide-w);
  height:var(--slide-h);
  background:var(--bg);
  overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.28);
  border-radius:6px;
}

/* スライド共通：タイトル→結論→図解→補足 の縦組み */
.slide-inner{position:absolute;inset:0;padding:var(--pad);display:flex;flex-direction:column;}

/* ヘッダ（ページ番号＋タイトル） */
.s-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:6px;}
.s-no{
  flex:0 0 auto;width:46px;height:46px;border-radius:10px;background:var(--primary);
  color:#fff;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;
}
.s-title{font-size:30px;font-weight:900;color:var(--primary);letter-spacing:.02em;line-height:1.2;padding-top:4px;}
.s-msg{font-size:18px;font-weight:500;color:var(--ink-sub);margin:4px 0 0 64px;}
.s-msg.noindent{margin-left:0;}
/* ページ番号（右下） */
.s-page{position:absolute;right:30px;bottom:22px;font-size:13px;font-weight:700;color:#9aa3b2;z-index:6;letter-spacing:.04em;}
.divider .s-page{color:rgba(255,255,255,.5);}

/* フッタ */
.s-foot{position:absolute;left:var(--pad);right:var(--pad);bottom:26px;display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--ink-sub);border-top:1px solid var(--line);padding-top:10px;}
.s-foot .brand{font-weight:700;color:var(--primary);}
.unit{font-size:12px;color:var(--ink-sub);position:absolute;right:64px;top:70px;}

/* ============ 1. 表紙 ============ */
.cover{background:linear-gradient(135deg,#0a2257 0%,#0F2D6B 55%,#143a86 100%);}
.cover .slide-inner{padding:0;}
.cover-left{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:88px;color:#fff;z-index:2;}
.cover-logo{display:flex;align-items:center;gap:16px;margin-bottom:54px;}
.cover-logo .mark{width:64px;height:64px;border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;}
.cover-logo .name{font-size:20px;font-weight:700;letter-spacing:.08em;}
.cover h1{font-size:62px;font-weight:900;line-height:1.15;letter-spacing:.01em;}
.cover h1 .fy{display:block;font-size:34px;font-weight:700;color:#9fc0ff;margin-bottom:8px;}
.cover .sub{margin-top:34px;font-size:16px;color:#cdd9f2;line-height:1.9;}
.cover .deco{position:absolute;right:-120px;top:-120px;width:520px;height:520px;border:64px solid rgba(255,255,255,.05);border-radius:50%;}
.cover .deco2{position:absolute;right:90px;bottom:-160px;width:360px;height:360px;border:40px solid rgba(31,95,255,.18);border-radius:50%;}

/* ============ 2. 事業紹介グリッド ============ */
.biz-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:30px;flex:1;align-content:center;}
.biz-tile{background:var(--gray);border-radius:14px;padding:24px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:14px;}
.biz-tile .ic{width:48px;height:48px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;}
.biz-tile .nm{font-size:16px;font-weight:700;color:var(--ink);line-height:1.4;}
.biz-note{text-align:center;font-size:16px;color:var(--ink-sub);font-weight:500;margin-top:8px;}

/* ============ 3-6. 事業紹介 split ============ */
.biz{display:flex;gap:48px;flex:1;align-items:center;margin-top:6px;}
.photo{flex:0 0 440px;height:380px;border-radius:16px;background:var(--gray);border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink-sub);}
.photo .lbl{font-size:14px;font-weight:700;}
.biz-body{flex:1;}
.biz-body .lead{font-size:21px;font-weight:700;color:var(--primary);line-height:1.6;margin-bottom:24px;}
.biz-ul{display:flex;flex-direction:column;gap:18px;}
.biz-ul .li{display:flex;gap:14px;align-items:flex-start;font-size:18px;line-height:1.6;}
.biz-ul .li .b{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:rgba(31,95,255,.12);color:var(--secondary);display:flex;align-items:center;justify-content:center;margin-top:2px;}
.biz-stat{margin-top:26px;display:inline-flex;align-items:baseline;gap:12px;background:var(--gray);border-radius:12px;padding:14px 22px;}
.biz-stat .v{font-size:30px;font-weight:900;color:var(--primary);}
.biz-stat .l{font-size:14px;color:var(--ink-sub);}
.imgbox{position:relative;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
.imgbox img{position:relative;z-index:2;width:100%;height:100%;object-fit:contain;display:block;}
.imgbox .ph{position:absolute;z-index:1;inset:0;background:var(--gray);border:2px dashed var(--line);border-radius:16px;color:var(--ink-sub);font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.5;}
.imgbox .ph small{font-size:11px;font-weight:500;opacity:.7;}
.logo-wall{flex:0 0 440px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.logo-wall .lg{height:88px;border-radius:10px;background:var(--gray);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:#aebbd6;font-weight:900;font-size:13px;}

/* ============ KPIカード ============ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:26px;flex:1;align-content:center;}
.kpi{background:var(--gray);border-radius:14px;padding:26px 24px;display:flex;flex-direction:column;border-top:4px solid var(--primary);}
.kpi .label{font-size:15px;color:var(--ink-sub);font-weight:700;}
.kpi .val{font-size:48px;font-weight:900;color:var(--primary);line-height:1.1;margin-top:10px;letter-spacing:-.01em;}
.kpi .val .u{font-size:18px;font-weight:700;color:var(--ink-sub);margin-left:4px;}
.kpi .meta{margin-top:14px;font-size:13px;color:var(--ink-sub);line-height:1.7;}
.kpi .badge{display:inline-block;margin-top:14px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;align-self:flex-start;}
.kpi .badge.up{background:rgba(0,167,111,.12);color:var(--success);}
.kpi .badge.down{background:rgba(255,86,48,.12);color:var(--danger);}
.kpi .badge.flat{background:rgba(15,45,107,.10);color:var(--primary);}
.kpi.neg .val{color:var(--danger);}

/* ============ ドーナツ ============ */
.split{display:flex;gap:48px;flex:1;align-items:center;margin-top:10px;}
.donut-wrap{flex:0 0 380px;position:relative;display:flex;align-items:center;justify-content:center;}
.donut-center{position:absolute;text-align:center;}
.donut-center .big{font-size:46px;font-weight:900;color:var(--primary);line-height:1;}
.donut-center .cap{font-size:14px;color:var(--ink-sub);font-weight:700;margin-bottom:6px;}
.donut-center .u{font-size:16px;color:var(--ink-sub);}
.legend{flex:1;display:flex;flex-direction:column;gap:14px;}
.legend .row{display:flex;align-items:center;gap:14px;font-size:18px;}
.legend .dot{width:16px;height:16px;border-radius:4px;flex:0 0 auto;}
.legend .nm{flex:1;font-weight:500;}
.legend .pct{font-weight:900;color:var(--primary);font-size:22px;}

/* ============ ゲージ（達成率） ============ */
.gauge-layout{display:flex;gap:56px;flex:1;align-items:center;}
.gauge-wrap{flex:0 0 300px;position:relative;display:flex;align-items:center;justify-content:center;}
.gauge-center{position:absolute;text-align:center;}
.gauge-center .pct{font-size:58px;font-weight:900;color:var(--primary);line-height:1;}
.gauge-center .cap{font-size:14px;color:var(--ink-sub);font-weight:700;}
.gauge-bars{flex:1;display:flex;flex-direction:column;gap:30px;}
.gbar .top{display:flex;justify-content:space-between;font-size:16px;margin-bottom:8px;color:var(--ink-sub);font-weight:700;}
.gbar .top .v{font-size:26px;font-weight:900;color:var(--primary);}
.gbar .track{height:26px;background:var(--gray);border-radius:8px;overflow:hidden;}
.gbar .fill{height:100%;border-radius:8px;}
.gbar .fill.target{background:var(--line);}
.gbar .fill.actual{background:linear-gradient(90deg,var(--secondary),var(--primary));}
.diff{margin-top:22px;font-size:18px;font-weight:700;}
.diff .down{color:var(--danger);}
.diff .up{color:#00875a;}

/* ============ 前年比較棒 ============ */
.cmp-row{display:flex;gap:60px;flex:1;align-items:flex-end;justify-content:center;padding:30px 40px 0;}
.cmp-col{display:flex;flex-direction:column;align-items:center;gap:14px;}
.cmp-bars{display:flex;align-items:flex-end;gap:34px;height:340px;}
.cmp-bar{width:88px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;}
.cmp-bar .bar{width:100%;border-radius:8px 8px 0 0;}
.cmp-bar .bar.prev{background:var(--line);}
.cmp-bar .bar.cur{background:linear-gradient(180deg,var(--secondary),var(--primary));}
.cmp-bar .v{font-size:24px;font-weight:900;color:var(--primary);margin-bottom:8px;}
.cmp-bar .yr{font-size:13px;color:var(--ink-sub);margin-top:10px;font-weight:700;text-align:center;line-height:1.4;}
.cmp-col .ttl{font-size:18px;font-weight:900;color:var(--primary);}
.cmp-col .delta{font-size:15px;font-weight:700;padding:5px 14px;border-radius:999px;background:rgba(107,118,134,.14);color:var(--ink-sub);}
.cmp-col .delta.good{background:rgba(0,167,111,.14);color:#00875a;}
.cmp-col .delta.warn{background:rgba(255,176,32,.18);color:#b06f00;}
.cmp-col .delta.bad{background:rgba(255,86,48,.12);color:var(--danger);}
.cmp-bar .sub{font-size:11px;color:var(--ink-sub);margin-top:2px;}
.yoy-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;}
.yoy-body .cmp-row{flex:none;padding-top:0;}
.yoy-body .cmp-bars{height:190px;}
.yoy-note{text-align:center;font-size:12px;color:#7a8699;line-height:1.5;}
.yoy-op{display:flex;align-items:center;justify-content:center;gap:14px;background:rgba(0,167,111,.09);border:1px solid rgba(0,167,111,.35);border-radius:14px;padding:16px;font-size:22px;font-weight:900;color:var(--primary);}
.yoy-op .lab{font-size:16px;color:var(--ink-sub);}
.yoy-op .prev{color:var(--danger);}
.yoy-op .cur{color:#00875a;}
.yoy-op .arr{color:var(--ink-sub);}
.yoy-op .tag{background:var(--success);color:#fff;border-radius:999px;padding:5px 16px;font-size:15px;}

/* ============ 折れ線 ============ */
.line-layout{display:flex;gap:40px;flex:1;align-items:center;}
.line-wrap{flex:1;}
.line-side{flex:0 0 230px;background:var(--gray);border-radius:14px;padding:28px;text-align:center;}
.line-side .cap{font-size:14px;color:var(--ink-sub);font-weight:700;}
.line-side .big{font-size:50px;font-weight:900;color:var(--primary);margin:6px 0;}
.line-side .delta{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:999px;background:rgba(0,167,111,.12);color:var(--success);font-weight:900;font-size:18px;}
.line-legend{display:flex;gap:20px;justify-content:center;margin-top:8px;font-size:14px;color:var(--ink-sub);}
.line-legend .it{display:flex;align-items:center;gap:8px;}
.line-legend .ln{width:22px;height:4px;border-radius:2px;}

/* ============ ハイライト ============ */
.hl-list{display:flex;flex-direction:column;gap:16px;flex:1;justify-content:center;margin-top:10px;}
.hl{display:flex;gap:20px;align-items:center;background:var(--gray);border-radius:14px;padding:20px 26px;border-left:4px solid var(--secondary);}
.hl .ic{flex:0 0 auto;width:52px;height:52px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;}
.hl .tx .t{font-size:20px;font-weight:900;color:var(--primary);}
.hl .tx .d{font-size:14px;color:var(--ink-sub);margin-top:3px;}

/* ============ 総評（レーダー） ============ */
.radar-layout{display:flex;gap:50px;flex:1;align-items:center;justify-content:center;}
.radar-note{flex:0 0 300px;display:flex;flex-direction:column;gap:14px;}
.radar-note .it{background:var(--gray);border-radius:12px;padding:16px 20px;}
.radar-note .it .k{font-size:15px;font-weight:900;color:var(--primary);}
.radar-note .it .d{font-size:13px;color:var(--ink-sub);margin-top:4px;line-height:1.6;}

/* ============ 課題カード ============ */
.issue-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;flex:1;align-content:center;margin-top:10px;}
.issue{background:var(--gray);border-radius:14px;padding:28px 24px;border-top:4px solid var(--warning);}
.issue .ic{width:48px;height:48px;border-radius:12px;background:rgba(255,176,32,.15);color:var(--warning);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.issue .t{font-size:19px;font-weight:900;color:var(--primary);line-height:1.4;}
.issue .d{font-size:14px;color:var(--ink-sub);margin-top:10px;line-height:1.7;}

/* ============ 実行アクション ============ */
.action-table{flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center;margin-top:10px;}
.act-row{display:flex;align-items:center;gap:24px;background:var(--gray);border-radius:14px;padding:20px 26px;}
.act-row .issue-c{flex:0 0 280px;font-size:18px;font-weight:900;color:var(--primary);}
.act-row .arrow{flex:0 0 auto;color:var(--secondary);font-size:24px;font-weight:900;}
.act-row .measures{flex:1;display:flex;flex-direction:column;gap:8px;}
.act-row .measures .m{font-size:16px;color:var(--ink);display:flex;gap:10px;align-items:center;}
.act-row .measures .m .d{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--secondary);}

/* ============ テーブル（予測・着地） ============ */
.tbl-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;}
.ftable{width:100%;border-collapse:collapse;}
.ftable th,.ftable td{padding:16px 20px;text-align:right;border-bottom:1px solid var(--line);}
.ftable thead th{font-size:14px;color:var(--ink-sub);font-weight:700;background:var(--gray);border-bottom:2px solid var(--line);}
.ftable th:first-child,.ftable td:first-child{text-align:left;font-weight:900;color:var(--primary);font-size:16px;}
.ftable td{font-weight:900;color:var(--primary);font-size:24px;}
.ftable td.neg{color:var(--danger);}
.ftable td.rate{color:var(--secondary);}
.ftable tfoot td{font-size:20px;}
.tbl-note{margin-top:22px;font-size:15px;color:var(--ink-sub);text-align:center;background:var(--gray);border-radius:10px;padding:14px 18px;line-height:1.6;}

/* ============ Before/After 図解 ============ */
.ba-sub{text-align:center;font-size:17px;color:var(--ink-sub);font-weight:500;margin-top:6px;}
.ba-layout{display:flex;align-items:center;justify-content:center;gap:34px;flex:1;}
.ba-card{flex:1;max-width:380px;border-radius:16px;padding:34px;min-height:280px;display:flex;flex-direction:column;}
.ba-card.before{background:var(--gray);border:2px solid var(--line);}
.ba-card.after{background:var(--primary);color:#fff;}
.ba-card .tag{font-size:14px;font-weight:900;letter-spacing:.1em;margin-bottom:18px;}
.ba-card.before .tag{color:var(--ink-sub);}
.ba-card.after .tag{color:#9fc0ff;}
.ba-card .h{font-size:26px;font-weight:900;line-height:1.4;}
.ba-card.before .h{color:var(--primary);}
.ba-card .desc{margin-top:16px;font-size:15px;line-height:1.9;}
.ba-card.before .desc{color:var(--ink-sub);}
.ba-card.after .desc{color:#cdd9f2;}
.ba-arrow{flex:0 0 auto;font-size:48px;color:var(--secondary);font-weight:900;}
.ba-foot{text-align:center;font-size:15px;color:var(--ink-sub);margin-top:6px;font-weight:500;}

/* ============ 目指す姿（数式） ============ */
.eq-lead{text-align:center;font-size:24px;font-weight:900;color:var(--primary);margin-top:24px;}
.eq{display:flex;align-items:center;justify-content:center;gap:22px;flex:1;}
.eq-box{width:236px;min-height:210px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;}
.eq-box.a,.eq-box.b{background:var(--gray);border:2px solid var(--line);}
.eq-box.r{background:var(--primary);color:#fff;}
.eq-box .ic{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(31,95,255,.12);color:var(--secondary);}
.eq-box.r .ic{background:rgba(255,255,255,.16);color:#fff;}
.eq-box .t{font-size:22px;font-weight:900;color:var(--primary);}
.eq-box.r .t{color:#fff;}
.eq-box .s{font-size:13px;color:var(--ink-sub);}
.eq-box.r .s{color:#cdd9f2;}
.eq-op{font-size:40px;font-weight:900;color:var(--ink-sub);}
.eq-foot{text-align:center;font-size:16px;color:var(--ink-sub);margin-top:2px;font-weight:500;}

/* ============ 総括 ============ */
.sum-list{display:flex;flex-direction:column;gap:16px;flex:1;justify-content:center;margin-top:6px;}
.sum{display:flex;gap:18px;align-items:center;font-size:21px;}
.sum .ic{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:rgba(0,167,111,.12);color:var(--success);display:flex;align-items:center;justify-content:center;}
.sum .tx{font-weight:700;color:var(--ink);}
.sum-banner{margin-top:18px;background:var(--primary);color:#fff;border-radius:14px;padding:22px;text-align:center;font-size:20px;font-weight:900;letter-spacing:.02em;}

/* ============ 結論バッジ（達成度ラベル） ============ */
.cbadge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:15px;font-weight:900;}
.cbadge.good{background:rgba(0,167,111,.14);color:#00875a;}
.cbadge.warn{background:rgba(255,176,32,.18);color:#b06f00;}
.cbadge.bad{background:rgba(255,86,48,.14);color:#d83a18;}

/* ============ 用語注釈 ============ */
.s-terms{position:absolute;left:64px;right:64px;bottom:56px;font-size:13px;color:#7a8699;line-height:1.5;}

/* 幅広バッジ（要約 / モデル などの非番号スライド用） */
.s-no.wide{width:auto;padding:0 16px;font-size:16px;}

/* ============ エグゼクティブサマリー ============ */
.exec-pts{display:flex;flex-direction:column;gap:14px;margin-top:22px;}
.exec-pt{display:flex;gap:18px;align-items:center;background:var(--gray);border-radius:14px;padding:20px 26px;}
.exec-pt .n{flex:0 0 auto;width:40px;height:40px;border-radius:10px;background:var(--primary);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;}
.exec-pt .tx{flex:1;}
.exec-pt .tx .t{font-size:21px;font-weight:900;color:var(--primary);}
.exec-pt .tx .d{font-size:14px;color:var(--ink-sub);margin-top:3px;}
.exec-kpis{display:flex;gap:16px;margin-top:16px;}

/* ============ 章扉（セクション区切り） ============ */
.divider{background:linear-gradient(135deg,#0a2257 0%,#0F2D6B 60%,#143a86 100%);color:#fff;}
.divider .slide-inner{justify-content:center;}
.divider .slide-inner>div{position:relative;z-index:2;}
.dv-no{position:absolute;right:70px;top:50%;transform:translateY(-50%);font-size:260px;font-weight:900;color:rgba(255,255,255,.09);line-height:.8;z-index:1;}

.dv-title{font-size:54px;font-weight:900;margin-top:10px;}

/* ============ 収益モデル（お金の流れ図） ============ */
.flow{display:flex;align-items:center;gap:18px;flex:1;margin-top:10px;}
.flow-col{flex:1;display:flex;flex-direction:column;gap:14px;}
.flow-arrow{flex:0 0 auto;color:var(--secondary);font-size:34px;font-weight:900;}
.flow-box{background:var(--gray);border-radius:14px;padding:24px 20px;text-align:center;}
.flow-box.tall{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.flow-box .h{font-weight:900;color:var(--primary);font-size:20px;}
.flow-box .d{font-size:13px;color:var(--ink-sub);margin-top:8px;}
.flow-box .chips{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:16px;}
.flow-box .chip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700;color:var(--primary);}
.rev-col{justify-content:center;}
.rev{border-radius:12px;padding:16px 18px;color:#fff;}
.rev .t{font-weight:900;font-size:18px;}
.rev .s{font-size:12px;margin-top:4px;opacity:.92;}
.rev.buy{background:#0F2D6B;}
.rev.fee{background:#1F5FFF;}
.rev.stock{background:#00A76F;}

/* ============ 印刷(PDF)：1スライド=1ページ ============ */
@page{size:1280px 720px;margin:0;}
@media print{

  .slide{box-shadow:none;border-radius:0;page-break-after:always;break-after:page;}
  .slide:last-child{page-break-after:auto;}
}

const NS="http://www.w3.org/2000/svg";
const el=(t,a={},kids=[])=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);kids.forEach(c=>e.appendChild(c));return e;};
const polar=(cx,cy,r,deg)=>{const a=(deg-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
function arcPath(cx,cy,r,start,end){
  const [x1,y1]=polar(cx,cy,r,end),[x2,y2]=polar(cx,cy,r,start);
  const large=end-start<=180?0:1;
  return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 0 ${x2} ${y2}`;
}
function donut(items,size=300,thick=46){
  const r=(size-thick)/2, cx=size/2, cy=size/2;
  const svg=el("svg",{viewBox:`0 0 ${size} ${size}`,width:size,height:size});
  let acc=0;
  items.forEach(it=>{
    const start=acc/100*360, end=(acc+it.pct)/100*360; acc+=it.pct;
    svg.appendChild(el("path",{d:arcPath(cx,cy,r,start,end),fill:"none",stroke:it.color,"stroke-width":thick}));
  });
  return svg;
}
function gauge(rate,size=300,thick=26,c1="#1F5FFF",c2="#0F2D6B",gid="g"){
  const r=(size-thick)/2, cx=size/2, cy=size/2, id="grad-"+gid;
  const svg=el("svg",{viewBox:`0 0 ${size} ${size}`,width:size,height:size});
  svg.appendChild(el("circle",{cx,cy,r,fill:"none",stroke:"#EDEFF3","stroke-width":thick}));
  const g=el("linearGradient",{id,x1:"0",y1:"0",x2:"1",y2:"1"});
  g.appendChild(el("stop",{offset:"0%","stop-color":c1}));
  g.appendChild(el("stop",{offset:"100%","stop-color":c2}));
  svg.appendChild(el("defs",{},[g]));
  const end=rate/100*360;
  svg.appendChild(el("path",{d:arcPath(cx,cy,r,0,end>359.9?359.9:end),fill:"none",stroke:`url(#${id})`,"stroke-width":thick,"stroke-linecap":"round"}));
  return svg;
}
function lineChart(labels,sA,sB,w=620,h=320,cA="#B8C2D4",cB="#0F2D6B"){
  const padL=40,padB=34,padT=20,padR=14;
  const max=Math.max(...sA,...sB)*1.1;
  const iw=w-padL-padR, ih=h-padT-padB;
  const X=i=>padL+iw*i/(labels.length-1);
  const Y=v=>padT+ih*(1-v/max);
  const svg=el("svg",{viewBox:`0 0 ${w} ${h}`,width:"100%"});
  for(let gi=0;gi<=4;gi++){const y=padT+ih*gi/4;svg.appendChild(el("line",{x1:padL,y1:y,x2:w-padR,y2:y,stroke:"#E3E6EC","stroke-width":1}));}
  const path=(s,color)=>{
    let d=s.map((v,i)=>`${i?"L":"M"} ${X(i)} ${Y(v)}`).join(" ");
    svg.appendChild(el("path",{d,fill:"none",stroke:color,"stroke-width":3.5,"stroke-linejoin":"round"}));
    s.forEach((v,i)=>svg.appendChild(el("circle",{cx:X(i),cy:Y(v),r:4.5,fill:color})));
  };
  path(sA,cA); path(sB,cB);
  labels.forEach((m,i)=>{const t=el("text",{x:X(i),y:h-10,"text-anchor":"middle","font-size":12,fill:"#6B7686"});t.textContent=m;svg.appendChild(t);});
  return svg;
}
function radarChart(axes,size=360){
  const cx=size/2,cy=size/2,r=size/2-46,max=5,n=axes.length;
  const svg=el("svg",{viewBox:`0 0 ${size} ${size}`,width:size,height:size});
  const pt=(i,rad)=>polar(cx,cy,rad,360*i/n);
  for(let gi=1;gi<=max;gi++){
    const rr=r*gi/max;
    let d=axes.map((_,i)=>{const [x,y]=pt(i,rr);return `${i?"L":"M"} ${x} ${y}`;}).join(" ")+" Z";
    svg.appendChild(el("path",{d,fill:"none",stroke:"#E3E6EC","stroke-width":1}));
  }
  axes.forEach((a,i)=>{
    const [x,y]=pt(i,r);
    svg.appendChild(el("line",{x1:cx,y1:cy,x2:x,y2:y,stroke:"#E3E6EC","stroke-width":1}));
    const [lx,ly]=pt(i,r+24);
    const t=el("text",{x:lx,y:ly+4,"text-anchor":"middle","font-size":15,"font-weight":700,fill:"#0F2D6B"});t.textContent=a.k;svg.appendChild(t);
  });
  let d=axes.map((a,i)=>{const [x,y]=pt(i,r*a.v/max);return `${i?"L":"M"} ${x} ${y}`;}).join(" ")+" Z";
  svg.appendChild(el("path",{d,fill:"rgba(31,95,255,.18)",stroke:"#1F5FFF","stroke-width":2.5}));
  axes.forEach((a,i)=>{const [x,y]=pt(i,r*a.v/max);svg.appendChild(el("circle",{cx:x,cy:y,r:4,fill:"#0F2D6B"}));});
  return svg;
}

/* ===================== スライド土台 ===================== */
const deck=document.getElementById("deck");
let PAGE=0;
function addSlide(cls,builder){
  const s=document.createElement("div");
  s.className="slide "+(cls||"");
  builder(s);
  PAGE++;
  if(!/cover/.test(s.className)) s.insertAdjacentHTML("beforeend",`<div class="s-page">${PAGE}</div>`);
  deck.appendChild(s);
}
/* head(a,title,msg)：a が商材アイコン名なら左上にアイコン、数値なら番号バッジは出さない（ページ番号は右下に集約） */
const head=(a,title,msg)=>{
  const ic = (typeof a==="string" && ICONS[a]) ? `<div class="s-no">${icon(a,26)}</div>` : "";
  return `<div class="s-head">${ic}<div class="s-title">${title}</div></div><div class="s-msg${ic?"":" noindent"}">${msg}</div>`;
};
const foot=()=>`<div class="s-foot"><span class="brand">${DATA.company}</span><span>${DATA.group}｜${DATA.fy} 業績報告</span></div>`;
const unit=u=>`<span class="unit">単位：${u}</span>`;
const photoBox=()=>`<div class="photo"><span style="color:#aebbd6">${icon("camera",40,1.6)}</span><span class="lbl">写真スペース</span></div>`;
/* 画像枠：ファイルがあれば表示、無ければ「画像未配置」プレースホルダにフォールバック */
const imgBox=(src,h)=>`<div class="imgbox" style="${h}"><div class="ph">${icon("camera",30,1.6)}<span>画像未配置<br/><small>${src}</small></span></div><img src="${src}" loading="lazy" onload="this.previousElementSibling.style.display='none'" onerror="this.style.display='none'"/></div>`;
function bizPhoto(p){
  const a=p.images;
  if(!a||!a.length) return photoBox();
  if(a.length===1) return imgBox(a[0],"flex:0 0 440px;height:380px");
  return `<div style="flex:0 0 440px;height:380px;display:flex;flex-direction:column;gap:14px">${a.map(s=>imgBox(s,"flex:1;min-height:0")).join("")}</div>`;
}

/* 達成度 → 配色＆結論ラベル（90%以上=順調 / 70-89%=要改善 / 70%未満=要対応） */
const achv=(rate)=> rate>=100 ? {c1:"#1F5FFF",c2:"#0F2D6B",solid:"#1F5FFF",bt:"good",label:"計画を上回る"}
  : rate>=90 ? {c1:"#1F5FFF",c2:"#0F2D6B",solid:"#1F5FFF",bt:"good",label:"ほぼ計画通り"}
  : rate>=70 ? {c1:"#FFB020",c2:"#E0890B",solid:"#B06F00",bt:"warn",label:"目標未達・改善余地"}
  : {c1:"#FF7452",c2:"#FF5630",solid:"#D83A18",bt:"bad",label:"要対応"};
const cbadge=(bt,text)=>`<span class="cbadge ${bt}">${text}</span>`;
const terms=(arr)=>`<div class="s-terms">${arr.join("　／　")}</div>`;

addSlide("",s=>{
  const boxes=DATA.aim.boxes;

  boxes.forEach((b,i)=>{
    html+=`<div class="eq-box ${b.cls}"><div class="ic">${icon(b.icon,28)}</div><div class="t">${b.t}</div>${b.s?`<div class="s">${b.s}</div>`:""}</div>`;

  s.innerHTML=`<div class="slide-inner">
    ${head(23,"目指す姿","売上拡大 × 固定費最適化")}

});

});

/* ---- プレビュー用：?slide=N で単一スライド表示（本番表示には影響なし） ---- */
(()=>{
  const n=new URLSearchParams(location.search).get("slide");
  if(n===null)return;
  [...document.querySelectorAll(".slide")].forEach((s,i)=>{ if(i!==+n) s.style.display="none"; });
  deck.style.padding="0";
})();
</script>
